line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI uses function calls in argument defaults (Depends/Header) by design.
ignore = ["B008"]

[lint.per-file-ignores]
"tests/**" = ["E501"]
"ui/app.py" = ["E501"]        # long inline-HTML string literals
"ui/components.py" = ["E501"]
