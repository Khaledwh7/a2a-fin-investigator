name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Installs the locked set, not the loose spec, so CI runs the exact
      # versions the suite was verified against. See requirements.lock.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint (ruff)
        run: ruff check app ui tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Evaluation harness (gates at 80%)
        run: python -m app.evaluation
