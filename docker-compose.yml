# AI Financial Investigation Assistant — full stack.
#
#   docker compose up --build
#   → API  http://localhost:8000   (A2A agents + REST gateway)
#   → UI   http://localhost:8501   (Streamlit console)
#
# Security controls are ON here (JWT auth + RBAC + rate limiting) to show the
# production posture. The UI talks to the REST gateway, which is the trusted
# human boundary; agent-to-agent traffic is authenticated.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a_dev_password
      POSTGRES_DB: a2a
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://a2a:a2a_dev_password@postgres:5432/a2a
      # Peers resolve to this same container (single-process, six agents).
      PUBLIC_BASE_URL: http://api:8000
      ORCHESTRATOR_URL: http://api:8000/a2a/orchestrator
      KYC_URL: http://api:8000/a2a/kyc
      AML_URL: http://api:8000/a2a/aml
      SANCTIONS_URL: http://api:8000/a2a/sanctions
      RISK_URL: http://api:8000/a2a/risk
      REPORTING_URL: http://api:8000/a2a/reporting
      # --- security posture ---
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-32byte-minimum-secret-value}
      REQUIRE_AGENT_AUTH: "true"
      RATE_LIMIT_ENABLED: "true"
      REQUIRE_HUMAN_REVIEW: "true"   # pause high-stakes cases for analyst sign-off
      # Optional LLM (requires uncommenting anthropic in requirements.txt):
      LLM_ENABLED: "false"
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py",
              "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
